name: Makefile CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install poetry
      run: pipx install poetry

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'poetry'

    - run: poetry install --only=main

    - name: Run test
      run: poetry run python -m unittest discover

    - name: Export locked dependencies
      run: |
        poetry self add poetry-plugin-export
        poetry export --all-groups -f requirements.txt --without-hashes -o requirements-audit.txt

    - name: Run pip-audit
      uses: pypa/gh-action-pip-audit@v1.1.0
      with:
        inputs: requirements-audit.txt
        no-deps: true
